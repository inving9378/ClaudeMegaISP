# Seguridad V1.64 (2026-10-22) — nivel http (va en /etc/nginx/conf.d/).
# Dev tiene una copia de los datos de producción y se alcanza desde internet. Desde la red de la
# oficina, el propio servidor y sus contenedores se entra como siempre; desde fuera, nginx pide
# usuario y contraseña. Se decide por la IP de origen; la contraseña se activa solo afuera.
geo $megaisp_red_interna {
    default          0;
    127.0.0.1        1;
    ::1              1;
    192.168.104.0/22 1;   # LAN de la oficina: 192.168.104.0–192.168.107.255 (la red de la tarjeta del servidor)
    192.168.100.0/24 1;   # segmento 192.168.100.x de la oficina
    38.123.192.0/24  1;   # IPs públicas de la empresa (dev .199, prod .198)
    172.16.0.0/12    1;   # contenedores Docker del servidor (Evolution)
}
map $megaisp_red_interna $megaisp_auth_basic {
    1       off;
    default "MegaISP dev";
}
