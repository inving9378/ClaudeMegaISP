# Seguridad V1.64 — dentro de cada server{} de dev, ANTES de «location /».
# Rutas que usan máquinas de fuera y ya se autentican solas (token, firma o sesión de la app):
# quedan sin contraseña de nginx. Van directo a PHP: con try_files pasarían a /index.php y ahí
# se pediría la contraseña otra vez.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/megaisp/public;
}
location ~ ^/(mcp|api/roadmap-externo|webhooks|whatsapp/webhook|payments/spei/webhook|portal/openpay/webhook|talento/api)(/|$) {
    auth_basic off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_read_timeout 300;
}
location ^~ /downloads/ {
    auth_basic off;   # APK de las apps de campo
}
