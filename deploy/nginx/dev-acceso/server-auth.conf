# Seguridad V1.64 — dentro de cada server{} de dev (antes de los location).
# "off" desde la red interna; contraseña desde fuera. No usa «satisfy any»: así la terminal
# web (ttyd) conserva su propia revisión de sesión, que se sumaría con un OR.
auth_basic           $megaisp_auth_basic;
auth_basic_user_file /etc/nginx/megaisp-dev.htpasswd;
