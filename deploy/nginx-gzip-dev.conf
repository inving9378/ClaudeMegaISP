# gzip para las respuestas de texto/JSON de dev (item #9991136, 2026-09-14).
# Drop-in para /etc/nginx/conf.d/ (se incluye en el contexto http DESPUÉS del bloque gzip de
# nginx.conf, donde `gzip on;` ya está activo pero `gzip_types` quedó comentado → sin este
# archivo solo se comprime text/html y el JSON de la API de la Torre viaja crudo:
# /api/roadmap/items = 2.16 MB por carga, que comprimido pesa ~0.44 MB).
#
# NO se listan imágenes, pdf ni zip: gzip_types es una LISTA BLANCA por MIME — lo que no está
# aquí (image/*, application/pdf, application/zip, video/*) no se toca, y `gzip on` de
# nginx.conf ya venía comprimiendo text/html por default.
#
# Instalación / reversión: ver deploy/README-nginx-gzip-dev.md

gzip_types
    application/json
    application/javascript
    text/javascript
    text/plain
    text/css
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

# Menor a esto no vale la pena (cabeceras + CPU): las respuestas chicas de la API salen crudas.
gzip_min_length 1024;

# Nivel 4 = 0.44 MB para el JSON de 2.16 MB (medido 2026-09-14); el 6 solo baja 0.02 MB más y
# duplica el costo de CPU. El default de nginx (1) deja 0.51 MB.
gzip_comp_level 4;

# Vary: Accept-Encoding, para que un proxy/caché intermedio no sirva gzip a quien no lo pidió.
gzip_vary on;

# Comprimir también lo que pase por proxy_pass (no aplica hoy en dev, pero no estorba).
gzip_proxied any;
