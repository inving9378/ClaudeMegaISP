# Worker de la cola 'deploy' (pipeline de release: respaldo → git → push → GitHub Release → remoto)
#
# IMPORTANTE — corre como user=meganet (NO www-data, a diferencia de megaisp-queue.conf):
#   el pipeline necesita escribir en .git (dueño meganet) y usar la llave SSH de push
#   ~/.ssh/id_ed25519_github (de meganet). DeploymentService::buildEnv usa el HOME del
#   usuario del worker, por eso aquí HOME=/home/meganet.
#
# Requisito de permisos (opción A): storage/backup_test debe tener group-write para que
#   meganet (en grupo www-data) cree los respaldos por versión:
#     sudo chmod 2775 storage/backup_test
#
# Instalación:
#   sudo cp deploy/megaisp-deploy-worker.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl start megaisp-deploy
#
# --timeout=1860 debe ser >= el timeout del DeployJob (1800s); si no, el worker mataría
# el job (que incluye el respaldo de varios minutos) antes de tiempo.

[program:megaisp-deploy-worker]
process_name=%(program_name)s
command=php /var/www/megaisp/artisan queue:work database --queue=deploy --sleep=5 --tries=1 --timeout=1860
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/megaisp-deploy-worker.err.log
stdout_logfile=/var/log/supervisor/megaisp-deploy-worker.out.log
redirect_stderr=true
startsecs=10
stopwaitsecs=1860
numprocs=1
priority=999
user=meganet
directory=/var/www/megaisp
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/home/meganet"

[group:megaisp-deploy]
programs=megaisp-deploy-worker
priority=999
