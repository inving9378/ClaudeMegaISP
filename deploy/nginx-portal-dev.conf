# Server block del Portal Cliente en su dominio dedicado (item roadmap #144).
# Decisión aprobada por Irving: DEV primero (hosts file / DNS interno + cert
# autofirmado), NO producción todavía. Ver deploy/README-portal-dev.md.
#
# Este bloque NO reemplaza megaisp.conf (server_name _, default_server): solo
# responde al hostname de este server_name, así que el acceso normal por
# http://192.168.105.11 sigue intacto sin cambios.
#
# El routing por dominio dentro de Laravel (mismo código que /portal/*, sin el
# prefijo) ya está resuelto en app/Modules/Addons/PortalCliente/routes.php vía
# Route::domain(config('portalcliente.domain')) — este vhost solo necesita
# apuntar al mismo docroot de siempre.
#
# Instalación (con sudo — ver runbook completo en deploy/README-portal-dev.md):
#   sudo cp deploy/nginx-portal-dev.conf /etc/nginx/sites-available/megaisp-portal-dev.conf
#   sudo ln -s /etc/nginx/sites-available/megaisp-portal-dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl;
    server_name portal.meganet.mx;   # <-- ajustar si el dominio real difiere (config/portalcliente.php)

    root /var/www/megaisp/public;
    index index.php index.html;
    charset utf-8;

    # DEV: cert autofirmado local (mismo patrón que deploy/setup-https-dev.sh).
    # En PROD esto se reemplaza por certbot (Let's Encrypt, HTTP-01) una vez el
    # registro A público exista — ver README-portal-dev.md sección "Camino a prod".
    ssl_certificate     /etc/nginx/ssl-dev/portal.pem;
    ssl_certificate_key /etc/nginx/ssl-dev/portal-key.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 7200;
    }

    location ~ /\.(?!well-known).* { deny all; }
    client_max_body_size 2048M;
}
