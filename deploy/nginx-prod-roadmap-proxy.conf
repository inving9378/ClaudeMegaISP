# ============================================================================
# Reverse proxy PROD → DEV para el Circuito de Mejora Continua
# ============================================================================
#
# CONTEXTO: el fetcher de Claude Cowork (nube) exige HTTPS con CA válida. El
# firewall de la red RECHAZA 80/443 entrantes hacia DEV (192.168.105.11), pero
# PROD (https://v1megaisp.meganett.com.mx) SÍ es alcanzable desde internet con
# certificado válido. Solución: PROD publica SOLO el prefijo /api/roadmap-externo/
# y lo reenvía a DEV por la LAN. Nada más de DEV se expone por PROD.
#
# ⚠️ PRE-REQUISITO CRÍTICO (verificar ANTES de aplicar): PROD debe poder alcanzar
#    a DEV en el puerto 80 por la LAN. El CONTEXTO del proyecto dice que los dos
#    VMs históricamente NO se alcanzan entre sí. Desde PROD, por PuTTY:
#        curl -sI http://192.168.105.11/robots.txt
#    Debe devolver 200. Si da timeout/refused → el proxy dará 502 y hay que
#    habilitar esa ruta LAN primero (fuera de este archivo). NO aplicar hasta
#    que este curl responda 200.
#
# ----------------------------------------------------------------------------
# PARTE 1 — CONTEXTO http {}  (enmascarar el token del path en el access log)
# ----------------------------------------------------------------------------
# El token viaja en el path → el access log de PROD también lo vería en claro.
# Mismo enmascaramiento que se documentó para dev (commit fe6841c7).
# COLOCAR EN:  /etc/nginx/conf.d/roadmap-log-mask.conf   (se incluye en http {})
#
#   map $request_uri $roadmap_masked_uri {
#       default                                           $request_uri;
#       ~^(?<pre>/api/roadmap-externo/)[^/]+(?<post>.*)$  "${pre}***${post}";
#   }
#   log_format roadmap_masked '$remote_addr - $remote_user [$time_local] '
#                             '"$request_method $roadmap_masked_uri $server_protocol" '
#                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
#
# ----------------------------------------------------------------------------
# PARTE 2 — CONTEXTO server {}  (PEGAR DENTRO del server block 443 de
#           v1megaisp.meganett.com.mx, junto a los otros `location`)
# ----------------------------------------------------------------------------

    # Circuito de Mejora Continua: SOLO este prefijo se reenvía a DEV.
    # `^~` gana ANTES que la app de PROD (try_files/index.php) → el Laravel de
    # PROD NUNCA ve este path. El token va en el path y se preserva íntegro
    # porque proxy_pass NO lleva URI (ni barra final).
    location ^~ /api/roadmap-externo/ {
        # Log propio con el token enmascarado (usa el log_format de la PARTE 1).
        access_log /var/log/nginx/roadmap-externo-access.log roadmap_masked;

        proxy_pass http://192.168.105.11;      # DEV, puerto 80. SIN URI → path completo intacto.
        proxy_http_version 1.1;

        # DEV responde por su server default (server_name _), así que acepta este Host.
        proxy_set_header Host              $host;                 # v1megaisp.meganett.com.mx
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # El rate limit YA vive en DEV (throttle de Laravel). NO se duplica aquí.

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

# ----------------------------------------------------------------------------
# PASOS PARA APLICAR EN PROD (Irving, por PuTTY con sudo)
# ----------------------------------------------------------------------------
# 0) PRE-CHECK de alcance LAN (obligatorio):
#      curl -sI http://192.168.105.11/robots.txt        # debe dar 200
#
# 1) Ubicar el server block de v1megaisp (el bloque con `listen 443 ssl`):
#      sudo nginx -T 2>/dev/null | grep -nE "server_name .*v1megaisp|listen 443"
#      grep -rl "v1megaisp" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null
#
# 2) Colocar la PARTE 1 (map + log_format) en contexto http:
#      sudo nano /etc/nginx/conf.d/roadmap-log-mask.conf     # pegar el bloque de la PARTE 1 (sin los '#')
#
# 3) Pegar la PARTE 2 (el `location ^~ /api/roadmap-externo/ { ... }`) DENTRO del
#    server block 443 de v1megaisp (junto a los demás `location`):
#      sudo nano <archivo-del-server-block-hallado-en-el-paso-1>
#
# 4) Probar y recargar (sin downtime):
#      sudo nginx -t && sudo systemctl reload nginx
#
# 5) Verificar (desde DEV o desde cualquier lado con internet):
#      curl -sS "https://v1megaisp.meganett.com.mx/api/roadmap-externo/<READ_TOKEN>" | head -c 300
#    Debe devolver el JSON del circuito (generated_at, manual_criterios, items[...]).
#
# NOTA robots.txt: el fetcher pide https://v1megaisp.meganett.com.mx/robots.txt,
# que lo sirve PROD (NO se proxya). Verificar que sea permisivo:
#      curl -s https://v1megaisp.meganett.com.mx/robots.txt
# Si PROD respondiera "Disallow: /", tratarlo aparte (es SEO de producción; no se
# toca a la ligera).
