# Server block para el subdominio TLS del Circuito de Mejora Continua.
# Objetivo: exponer /api/roadmap-externo por HTTPS (443) para el fetcher de Claude
# Cowork, que convierte todo a HTTPS y NO acepta http:// ni certificados autofirmados.
#
# Se coloca APARTE del server block principal (server_name _, default_server) para
# NO afectar el acceso LAN por http://192.168.105.11: este bloque solo responde al
# hostname del subdominio.
#
# Instalación (con sudo, DESPUÉS de que el DNS resuelva):
#   sudo cp deploy/nginx-dev-tls.conf /etc/nginx/sites-available/megaisp-dev-tls.conf
#   sudo ln -s /etc/nginx/sites-available/megaisp-dev-tls.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dev.meganett.com.mx --agree-tos -m <correo> --redirect --non-interactive
# certbot AÑADE automáticamente el bloque `listen 443 ssl` + el redirect http→https
# a ESTE server block (por el server_name), sin tocar el default_server.

server {
    listen 80;
    listen [::]:80;
    server_name dev.meganett.com.mx;   # <-- ajustar al subdominio real que se cree en DNS

    root /var/www/megaisp/public;
    index index.php index.html;
    charset utf-8;

    # Reto ACME de Let's Encrypt (certbot --nginx lo gestiona; se deja explícito por claridad).
    location ^~ /.well-known/acme-challenge/ { allow all; root /var/www/megaisp/public; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 7200;
    }

    location ~ /\.(?!well-known).* { deny all; }

    client_max_body_size 2048M;
}
