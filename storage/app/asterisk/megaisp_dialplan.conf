; MegaISP Dialplan — generado/mantenido por MegaVoz. No editar manualmente.
; Incluido desde /etc/asterisk/extensions.conf vía #include

;============================================================
; CONTEXTO: from-internal
; Dispositivos registrados (extensiones PJSIP) llamando entre sí
; o marcando hacia afuera con prefijo 0
;============================================================
[from-internal]

; ── Extensiones internas (3 dígitos: 100-999) ──────────────
exten = _[1-9]XX,1,NoOp(Llamada interna: ${CALLERID(num)} → ${EXTEN})
 same = n,Set(CDR(userfield)=internal)
 same = n,Dial(PJSIP/${EXTEN},20)
 same = n,VoiceMail(${EXTEN}@default,u)
 same = n,Hangup()

; ── Extensiones internas (4 dígitos: 1000-9999) ────────────
exten = _[1-9]XXX,1,NoOp(Llamada interna: ${CALLERID(num)} → ${EXTEN})
 same = n,Set(CDR(userfield)=internal)
 same = n,Dial(PJSIP/${EXTEN},20)
 same = n,VoiceMail(${EXTEN}@default,u)
 same = n,Hangup()

; ── Salida por trunk (prefijo 0) ───────────────────────────
; Marcar 0 + número destino, ej. 015551234567
exten = _0[0-9].,1,NoOp(Llamada saliente: ${CALLERID(num)} → ${EXTEN:1})
 same = n,Set(CDR(userfield)=outbound)
 same = n,Dial(PJSIP/trunk_2/${EXTEN:1},30)
 same = n,Hangup()

; ── Acceso al IVR desde extensión interna (marcar 9) ───────
exten = 9,1,Goto(from-ivr,ivr,1)

; ── María (IA Bot) — extensión 1000 ────────────────────────
; Literal tiene prioridad sobre _[1-9]XXX — no es un endpoint PJSIP
exten = 1000,1,NoOp(Llamada a María IA desde ${CALLERID(num)})
 same = n,Answer()
 same = n,Wait(1)
 same = n,Goto(from-ia-bot,bot,1)

; ── Colgar en caso de extensión inválida ───────────────────
exten = i,1,NoOp(Extensión no encontrada: ${EXTEN})
 same = n,Hangup()
exten = t,1,Hangup()

;============================================================
; CONTEXTO: from-trunk
; Llamadas entrantes del trunk SIP externo (trunk_2 / Servnet)
;============================================================
[from-trunk]

; Punto de entrada de llamada entrante
exten = s,1,NoOp(Llamada entrante de trunk: CallerID=${CALLERID(all)})
 same = n,Answer()
 same = n,Wait(1)
 same = n,Set(CDR(userfield)=inbound)
 same = n,Goto(from-ivr,ivr,1)

; DID específico (si el trunk entrega el número marcado)
exten = _X.,1,NoOp(Llamada entrante DID: ${EXTEN})
 same = n,Answer()
 same = n,Wait(1)
 same = n,Set(CDR(userfield)=inbound)
 same = n,Goto(from-ivr,ivr,1)

exten = i,1,Hangup()
exten = t,1,Hangup()

;============================================================
; CONTEXTO: from-ivr
; Menú interactivo (Fase D1 — IVR)
; Los archivos de audio van en /var/lib/asterisk/sounds/ivr/
;============================================================
[from-ivr]

; Entrada principal del IVR
exten = ivr,1,NoOp(IVR iniciando)
 same = n,Answer()
 same = n,Wait(1)
 same = n,Background(ivr/welcome)
 same = n,WaitExten(5)

; Opción 1 → Extensión 1001 (configurar según tus extensiones)
exten = 1,1,NoOp(IVR → opción 1)
 same = n,Dial(PJSIP/1001,20)
 same = n,VoiceMail(1001@default,u)
 same = n,Hangup()

; Opción 2 → (agregar extensión de ventas cuando exista)
exten = 2,1,NoOp(IVR → opción 2 sin asignar)
 same = n,Playback(ivr/invalid)
 same = n,Goto(from-ivr,ivr,1)

; Opción 3 → IA Bot (Fase D2, placeholder)
exten = 3,1,NoOp(IVR → IA Bot [D2 pendiente])
 same = n,Goto(from-ia-bot,bot,1)

; Timeout: nadie presionó nada → repetir
exten = t,1,NoOp(Timeout IVR — repitiendo)
 same = n,Goto(from-ivr,ivr,1)

; Entrada inválida → repitir
exten = i,1,Playback(ivr/invalid)
 same = n,Goto(from-ivr,ivr,1)

;============================================================
; CONTEXTO: from-ia-bot
; Asistente IA MegaVoz (Fase D2 — María)
; AGI: STT Whisper + GPT-4o-mini + TTS OpenAI
;============================================================
[from-ia-bot]

exten = bot,1,NoOp(IA Bot María iniciando | CallerID=${CALLERID(num)})
 same = n,AGI(/var/www/megaisp/storage/app/asterisk/ia_bot.php)
 same = n,Hangup()

exten = i,1,Hangup()
exten = t,1,Hangup()

#include "/var/www/megaisp/storage/app/asterisk/megaisp_grupos.conf"
