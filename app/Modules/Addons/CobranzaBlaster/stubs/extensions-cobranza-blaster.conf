; ─────────────────────────────────────────────────────────────────────────────
; CobranzaBlaster — dialplan del blaster de cobranza
;
; Copiar/incluir en:  /etc/asterisk/extensions.conf
; Recargar:           sudo asterisk -rx "dialplan reload"
;
; El AMI Originate (AmiConnectionService::originate) entra por el contexto
; AMI_CONTEXT (.env, por defecto "cobranza-blaster"), extensión s, prioridad 1,
; con estas variables de canal:
;   COBRANZA_LLAMADA_ID  -> id de cobranza_llamadas
;   COBRANZA_NOMBRE      -> nombre del cliente
;   COBRANZA_AUDIO       -> ruta absoluta del WAV TTS (sin extensión al usar Playback)
;
; El Uniqueid del canal lo fijamos nosotros vía ChannelId ("cob-<llamadaId>-<ts>"),
; por eso el listener (cobranza:ami-listener) correlaciona cada evento Newstate/
; Hangup/DTMFEnd directamente con la fila de la llamada. NO se requiere ningún
; curl/UserEvent desde el dialplan: basta con que los eventos estándar de canal
; lleguen al AMI (que es el comportamiento por defecto).
; ─────────────────────────────────────────────────────────────────────────────
[cobranza-blaster]
exten => s,1,NoOp(Cobranza llamada ${COBRANZA_LLAMADA_ID} -> ${COBRANZA_NOMBRE})
 same => n,Answer()
 same => n,Wait(1)
 ; Playback espera la ruta SIN extensión; COBRANZA_AUDIO viene como ...wav -> recortar
 same => n,Set(AUDIO_BASE=${CUT(COBRANZA_AUDIO,.,1)})
 same => n,Background(${AUDIO_BASE})        ; reproduce y permite capturar DTMF
 same => n,WaitExten(8)
 same => n,Hangup()

; El cliente presiona 1 -> transferir a la cola/asesor de cobranza.
; (El evento DTMFEnd con Digit=1 ya lo registra el listener como 'DTMF'.)
;
; ⚠️ Decisión de Irving (roadmap #190, 2026-08-04): DIFERIR la definición de
; quién/qué es 'asesor-cobranza' — la migración a un endpoint/cola PJSIP real
; (Dial(PJSIP/<destino>,30)) queda para una fase POSTERIOR, una vez que se
; defina el destino. Mientras tanto ya NO se intenta Dial(SIP/asesor-cobranza)
; (ese peer chan_sip nunca existió: siempre fallaba en silencio) — se
; reemplaza por un mensaje temporal + colgar, tal como Irving aprobó ("dejar
; Dial apuntando a buzón/mensaje temporal"). La locución principal
; (CobranzaTtsService::buildMensaje, roadmap #276) ya no promete "presione
; uno para hablar con un asesor", así que esta extensión solo se alcanza si
; el cliente marca 1 por su cuenta.
;
; ⚠️VERIFY: 'vm-nobodyavail' es un prompt estándar de core-sounds de
; Asterisk (normalmente ya instalado). Si el server no lo tiene, sustituir
; por otro prompt existente o grabar uno propio (ej. en
; /var/lib/asterisk/sounds/es/) y apuntar el Playback ahí.
exten => 1,1,NoOp(Cliente ${COBRANZA_LLAMADA_ID} solicita asesor - aun sin definir, ver roadmap #190)
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()

; Cualquier otra tecla o timeout -> colgar (queda como contestada/no_contesto).
exten => i,1,Hangup()
exten => t,1,Hangup()
