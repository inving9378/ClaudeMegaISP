; ─────────────────────────────────────────────────────────────────────────────
; CobranzaBlaster — listener persistente del AMI de Asterisk
;
; Copiar a:  /etc/supervisor/conf.d/megaisp-cobranza-ami.conf
; Luego:     sudo supervisorctl reread && sudo supervisorctl update
;            sudo supervisorctl start megaisp-cobranza-ami
;
; Reemplaza el "webhook AMI": Asterisk no hace HTTP POST por sí solo, así que
; mantenemos un socket abierto que lee eventos y despacha ProcessCallResultJob.
; Una sola instancia (numprocs=1): un único socket de eventos es suficiente.
; ─────────────────────────────────────────────────────────────────────────────
[program:megaisp-cobranza-ami]
process_name=%(program_name)s
command=php /var/www/megaisp/artisan cobranza:ami-listener
directory=/var/www/megaisp
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/megaisp-cobranza-ami.log
stopwaitsecs=15
stopsignal=TERM
