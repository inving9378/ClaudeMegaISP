[from-servnet]
exten => s,1,Answer()
exten => s,n,Hangup()

[cobranza-blaster]
; Laravel origina con: channel=SIP/servnet-trunk/NUMERO, context=cobranza-blaster, exten=s
exten => s,1,NoOp(Blaster iniciando llamada)
exten => s,n,Answer()
exten => s,n,Wait(1)
exten => s,n,Playback(cobranza/mensaje-${COBRANZA_CLIENT_ID})
exten => s,n,WaitExten(10)
exten => s,n,Hangup()

; 1 → transferir a agente
exten => 1,1,NoOp(Cliente presionó 1 - transfiriendo a agente)
exten => 1,n,Dial(SIP/agente,30,tT)
exten => 1,n,Hangup()

; 2 o sin respuesta → colgar
exten => 2,1,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()

[default]
exten => s,1,Hangup()
