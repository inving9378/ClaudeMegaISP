/* ─── Scoring ──────────────────────────────────────────────────── */
const getAvg=a=>{const s=Object.values(a).filter(n=>typeof n==='number');return s.length?s.reduce((x,y)=>x+y,0)/s.length:1;};
const getRec=(a,planes)=>{const avg=getAvg(a);if(avg>=2.35)return planes[2]?.id;if(avg>=1.75)return planes[1]?.id;return planes[0]?.id;};

  <div style={{gridColumn:full?'1/-1':'auto'}}>
    <label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:4}}>{label}</label>
    <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
      style={{width:'100%',border:'2px solid #e2e8f0',borderRadius:7,padding:'9px 11px',fontSize:13}}
      onFocus={e=>e.target.style.borderColor=C.blue} onBlur={e=>e.target.style.borderColor='#e2e8f0'}/>
    {note&&<div style={{fontSize:10,color:'#94a3b8',marginTop:3}}>{note}</div>}
  </div>
);
const Btn=({onClick,disabled,primary,ghost,danger,full,sm,children,style:st={}})=>{
  const bg=danger?C.red:primary?`linear-gradient(135deg,${C.blue},#0095d4)`:ghost?'transparent':'#fff';
  const col=danger||primary?'#fff':ghost?C.blue:C.navy;
  const brd=ghost?`2px solid ${C.blue}`:danger?`2px solid ${C.red}`:`2px solid #e2e8f0`;
  return <button onClick={onClick} disabled={disabled}
    style={{padding:sm?'6px 14px':'10px 20px',border:disabled?'2px solid #e2e8f0':brd,borderRadius:8,
    background:disabled?'#e2e8f0':bg,color:disabled?'#94a3b8':col,fontSize:sm?12:13,fontWeight:700,
    cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',fontFamily:'inherit',...st}}>
    {children}</button>;
};

export default function App(){
  const [cfg,setCfg]=useState(()=>loadCfg());
  const [phase,setPhase]=useState('intro');
  const [step,setStep]=useState(1);
  const [answers,setAnswers]=useState({});
  const [selIdx,setSelIdx]=useState({});
  const [company,setCompany]=useState('');
  const [contact,setContact]=useState('');
  const [phone,setPhone]=useState('');
  const [email,setEmail]=useState('');
  const [showCfg,setShowCfg]=useState(false);
  const [autoSent,setAutoSent]=useState(false);
  const [autoSentStatus,setAutoSentStatus]=useState('');
  const [cfgPass,setCfgPass]=useState('');
  const [cfgAuth,setCfgAuth]=useState(false);
  const [cfgErr,setCfgErr]=useState(false);

  const cur=STEPS[step-1];
  const planes=cfg.planes;
  const stepDone=cur?.qs.every(q=>answers[q.id]!==undefined);
  const totalQ=STEPS.reduce((a,s)=>a+s.qs.length,0);
  const answered=Object.keys(answers).length;
  const rec=getRec(answers,planes);
  const avg=getAvg(answers);
  const today=new Date().toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'});

  const openCfg=()=>{if(cfgAuth){setShowCfg(true);}else{setCfgErr(false);setCfgPass('');setShowCfg('auth');}};
  const authCfg=()=>{if(cfgPass===cfg.empresa.pass){setCfgAuth(true);setShowCfg(true);}else{setCfgErr(true);}};

  const handleAns=(qId,score,oi)=>{setAnswers(p=>({...p,[qId]:score}));setSelIdx(p=>({...p,[qId]:oi}));};

  const recPlan=planes.find(p=>p.id===rec);
  const scoreCol=avg>=2.35?C.red:avg>=1.75?C.blue:C.green;
  const scoreLabel=avg>=2.35?'Alta':avg>=1.75?'Media':'Básica';

  /* ─── Build comprehensive lead summary (for WhatsApp / email / Formspree) ─── */
  const buildLeadText=()=>{
    const L=[];
    L.push(`*🔔 Nueva evaluación de Internet — ${cfg.empresa.nombre}*`);
    L.push('');
    L.push(`📅 ${today}`);
    L.push('');
    L.push(`*👤 Datos del prospecto*`);
    L.push(`• Empresa: ${company||'(no proporcionada)'}`);
    if(contact)L.push(`• Contacto: ${contact}`);
    if(phone)L.push(`• Teléfono: ${phone}`);
    if(email)L.push(`• Email: ${email}`);
    L.push('');
    L.push(`*📊 Resultado del análisis*`);
    L.push(`• Puntaje: ${avg.toFixed(2)}/3.0 (${scoreLabel} criticidad)`);
    L.push(`• Recomendación: ${recPlan?.icon||''} ${recPlan?.nombre||''}`);
    L.push(`• Inversión estimada: $${recPlan?.precioMin}–$${recPlan?.precioMax} MXN/mes`);
    L.push(`• SLA: ${recPlan?.sla}`);
    L.push(`• Soporte: ${recPlan?.soporte}`);
    L.push('');
    L.push(`*📈 Diagnóstico por sección*`);
    STEPS.forEach(s=>{
      const sc=s.qs.filter(q=>answers[q.id]!==undefined).map(q=>answers[q.id]);
      const a=sc.length?sc.reduce((x,y)=>x+y,0)/sc.length:0;
      L.push(`${s.icon} ${s.t}: ${a.toFixed(1)}/3.0`);
    });
    L.push('');
    L.push(`*📋 Respuestas (${totalQ} preguntas)*`);
    let qNum=0;
    STEPS.forEach(s=>{
      L.push('');
      L.push(`◆ ${s.t}`);
      s.qs.forEach(q=>{
        qNum++;
        const oi=selIdx[q.id];
        const opt=oi!==undefined?q.opts[oi].l:'(no contestado)';
        L.push(`${qNum}. ${q.txt}`);
        L.push(`   → ${opt}`);
      });
    });
    return L.join('\n');
  };

  /* ─── Send actions ─── */
  const enviarPorWhatsApp=()=>{
    const wa=(cfg.empresa.whatsapp||'525568175643').replace(/\D/g,'');
    const msg=buildLeadText();
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,'_blank');
  };

  const enviarPorEmail=()=>{
    const dest=cfg.empresa.email||'ventas@meganett.com.mx';
    const subj=`Nueva evaluación — ${company||'(prospecto)'}`;
    const msg=buildLeadText();
    window.location.href=`mailto:${dest}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}`;
  };

  /* ─── Auto-send silencioso a Formspree/Web3Forms si está configurado ─── */
  const enviarSilencioso=async()=>{
    if(!cfg.empresa.formspreeUrl||autoSent)return;
    const payload={
      empresa:company,
      contacto:contact||'(no proporcionado)',
      telefono:phone||'(no proporcionado)',
      email:email||'(no proporcionado)',
      fecha:today,
      puntaje:`${avg.toFixed(2)}/3.0`,
      criticidad:scoreLabel,
      recomendacion:recPlan?.nombre,
      inversion_estimada:`$${recPlan?.precioMin}–$${recPlan?.precioMax} MXN/mes`,
      respuestas:STEPS.flatMap(s=>s.qs.map(q=>{
        const oi=selIdx[q.id];
        return{
          seccion:s.t,
          pregunta:q.txt,
          respuesta:oi!==undefined?q.opts[oi].l:'(sin contestar)',
          score:answers[q.id]||null
        };
      })),
      mensaje_completo:buildLeadText()
    };
    try{
      const res=await fetch(cfg.empresa.formspreeUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify(payload)
      });
      setAutoSent(true);
      setAutoSentStatus(res.ok?'ok':'error');
    }catch(e){
      setAutoSent(true);
      setAutoSentStatus('error');
    }
  };

  useEffect(()=>{
    if(phase==='results'&&cfg.empresa.formspreeUrl&&!autoSent){
      enviarSilencioso();
    }
  },[phase]);

  return(
    <div style={{minHeight:'100vh',background:C.bg}}>
      {showCfg==='auth'&&(
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.6)',zIndex:1100,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'#fff',borderRadius:14,padding:28,maxWidth:360,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
            <div style={{fontSize:16,fontWeight:800,color:C.navy,marginBottom:4,fontFamily:'Raleway,sans-serif'}}>🔒 Panel de Configuración</div>
            <div style={{fontSize:12,color:'#64748b',marginBottom:16}}>Ingrese la contraseña de administrador.</div>
            <input type="password" value={cfgPass} onChange={e=>{setCfgPass(e.target.value);setCfgErr(false);}}
              onKeyDown={e=>e.key==='Enter'&&authCfg()}
              placeholder="Contraseña" style={{width:'100%',border:`2px solid ${cfgErr?C.red:'#e2e8f0'}`,borderRadius:7,padding:'10px 12px',fontSize:13,marginBottom:cfgErr?4:12}}/>
            {cfgErr&&<div style={{color:C.red,fontSize:11,marginBottom:10}}>Contraseña incorrecta</div>}
            <div style={{display:'flex',gap:10}}>
              <Btn full onClick={()=>setShowCfg(false)}>Cancelar</Btn>
              <Btn full primary onClick={authCfg}>Ingresar →</Btn>
            </div>
          </div>
        </div>
      )}
      {showCfg===true&&<ConfigPanel cfg={cfg} setCfg={c=>setCfg(c)} onClose={()=>setShowCfg(false)}/>}

      {/* INTRO */}
      {phase==='intro'&&(
        <div style={{minHeight:'100vh',background:`linear-gradient(135deg,${C.navy},#1a2f45)`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
          <div style={{position:'absolute',top:16,right:20}}>
            <button onClick={openCfg}
              style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',padding:'8px 14px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:700}}>
              ⚙️ Config
            </button>
          </div>
          <div style={{maxWidth:520,width:'100%'}}>
            <div style={{textAlign:'center',marginBottom:24}}>
              <div style={{display:'inline-block',background:'rgba(255,255,255,.06)',borderRadius:16,padding:'20px 36px',marginBottom:20}}><Logo h={72}/></div>
              <h1 style={{color:'#fff',fontSize:22,fontWeight:800,margin:0,fontFamily:'Raleway,sans-serif'}}>Evaluador de Servicio de Internet Empresarial</h1>
              <p style={{color:'#94a3b8',fontSize:13,marginTop:8,lineHeight:1.6}}>Complete esta evaluación y reciba al instante una recomendación de servicio personalizada para su empresa.</p>
              <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:10,flexWrap:'wrap'}}>
                {[`📋 6 secciones`,`❓ ${totalQ} preguntas`,`⏱ ~5 min`,`📊 Resultado inmediato`].map((b,i)=>(
                  <div key={i} style={{background:'rgba(255,255,255,.08)',borderRadius:16,padding:'5px 12px',color:'#cbd5e1',fontSize:11}}>{b}</div>
                ))}
              </div>
            </div>
            <div style={{background:'#fff',borderRadius:14,padding:22,boxShadow:'0 16px 48px rgba(0,0,0,.25)'}}>
              <h2 style={{fontSize:14,fontWeight:700,color:C.navy,margin:'0 0 14px',fontFamily:'Raleway,sans-serif'}}>Información del Prospecto</h2>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <Inp label="Nombre de su Empresa *" full val={company} set={setCompany} ph="Razón social o nombre comercial"/>
                <Inp label="Su nombre" val={contact} set={setContact} ph="Nombre completo"/>
                <Inp label="Su Teléfono / WhatsApp" val={phone} set={setPhone} ph="55 xxxx xxxx"/>
                <Inp label="Su Correo Electrónico" val={email} set={setEmail} ph="correo@empresa.com"/>
              </div>
              <Btn full primary onClick={()=>{if(company.trim())setPhase('form');}} disabled={!company.trim()} style={{marginTop:16,padding:'13px'}}>
                Iniciar Evaluación →
              </Btn>
            </div>
          </div>
        </div>
      )}

      {/* FORM */}
      {phase==='form'&&(
        <>
          <Header cfg={cfg} company={company} onConfig={openCfg}/>
          <ProgBar cur={step} total={STEPS.length}/>
          <div style={{maxWidth:740,margin:'0 auto',padding:'20px 16px'}}>
            <div style={{background:'#fff',borderRadius:14,boxShadow:'0 2px 16px rgba(0,0,0,.07)',overflow:'hidden'}}>
              <div style={{background:`linear-gradient(135deg,${C.navy},#1a2f45)`,padding:'16px 22px',display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:26}}>{cur.icon}</span>
                <div>
                  <div style={{color:C.blue,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Sección {step} de {STEPS.length}</div>
                  <div style={{color:'#fff',fontSize:17,fontWeight:800,fontFamily:'Raleway,sans-serif'}}>{cur.t}</div>
                  <div style={{color:'#94a3b8',fontSize:12}}>{cur.sub}</div>
                </div>
              </div>
              <div style={{padding:'20px 22px'}}>
                {cur.qs.map((q,i)=><QCard key={q.id} q={q} selIdx={selIdx[q.id]} idx={i} onChange={(s,oi)=>handleAns(q.id,s,oi)}/>)}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:14,borderTop:'1px solid #f1f5f9'}}>
                  <Btn onClick={()=>step>1?setStep(s=>s-1):setPhase('intro')}>← {step>1?'Anterior':'Volver'}</Btn>
                  <span style={{fontSize:11,color:'#94a3b8'}}>{answered}/{totalQ} respondidas</span>
                  <Btn primary disabled={!stepDone} onClick={()=>{if(!stepDone)return;step<STEPS.length?setStep(s=>s+1):setPhase('results');}}>
                    {step<STEPS.length?'Siguiente →':'Ver resultados ✓'}
                  </Btn>
                </div>
              </div>
            </div>
          </div>
        </>
      )}

      {/* RESULTS */}
      {phase==='results'&&(
        <>
          <Header cfg={cfg} company={company} onConfig={openCfg}/>
          <div style={{maxWidth:1060,margin:'0 auto',padding:'20px 16px'}}>

            {/* Banner */}
            <div style={{background:`linear-gradient(135deg,${C.navy},#1a2f45)`,borderRadius:14,padding:'20px 26px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:16}}>
              <div>
                <div style={{color:C.blue,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:3}}>Evaluación completada — {today}</div>
                <h2 style={{color:'#fff',margin:0,fontSize:19,fontFamily:'Raleway,sans-serif',fontWeight:800}}>Recomendación para <span style={{color:C.blue}}>{company}</span></h2>
                {contact&&<div style={{color:'#94a3b8',fontSize:12,marginTop:3}}>Contacto: {contact}{phone?' · '+phone:''}{email?' · '+email:''}</div>}
              </div>
              <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                <div style={{background:'rgba(255,255,255,.08)',borderRadius:10,padding:'10px 16px',textAlign:'center'}}>
                  <div style={{fontSize:9,color:'#94a3b8',textTransform:'uppercase'}}>Puntaje</div>
                  <div style={{fontSize:22,fontWeight:800,color:scoreCol}}>{avg.toFixed(2)}<span style={{fontSize:11,color:'#64748b'}}>/3.0</span></div>
                  <div style={{fontSize:10,color:scoreCol,fontWeight:600}}>{scoreLabel} criticidad</div>
                </div>
                <div style={{background:'rgba(255,255,255,.08)',borderRadius:10,padding:'10px 16px',textAlign:'center'}}>
                  <div style={{fontSize:9,color:'#94a3b8',textTransform:'uppercase'}}>Solución</div>
                  <div style={{fontSize:17,fontWeight:800,color:'#fff'}}>{recPlan?.icon} {recPlan?.nombre}</div>
                  <div style={{fontSize:10,color:C.green,fontWeight:600}}>{recPlan?.sla}</div>
                </div>
              </div>
            </div>

            {/* AUTO-SEND status banner (silencioso, si está configurado) */}
            {cfg.empresa.formspreeUrl&&autoSent&&autoSentStatus==='ok'&&(
              <div className="no-print" style={{background:'#d1fae5',border:'1px solid #10b981',borderRadius:10,padding:'10px 16px',marginBottom:16,fontSize:12,color:'#065f46',fontWeight:600}}>
                ✓ Sus datos fueron enviados a un asesor de {cfg.empresa.nombre}. Le contactaremos pronto.
              </div>
            )}
            {cfg.empresa.formspreeUrl&&autoSent&&autoSentStatus==='error'&&(
              <div className="no-print" style={{background:'#fee2e2',border:'1px solid #ef4444',borderRadius:10,padding:'10px 16px',marginBottom:16,fontSize:12,color:'#7f1d1d',fontWeight:600}}>
                ⚠️ No pudimos enviar sus datos automáticamente. Por favor use los botones de WhatsApp/Email abajo.
              </div>
            )}

            {/* CTA principal — enviar al asesor */}
            <div className="no-print" style={{background:`linear-gradient(135deg,#25D366,#128C7E)`,borderRadius:14,padding:'18px 24px',marginBottom:18,boxShadow:'0 4px 16px rgba(37,211,102,.3)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:14}}>
                <div style={{flex:'1 1 240px'}}>
                  <div style={{color:'#fff',fontSize:16,fontWeight:800,marginBottom:3,fontFamily:'Raleway,sans-serif'}}>📩 ¿Listo para una cotización formal?</div>
                  <div style={{color:'rgba(255,255,255,.9)',fontSize:12,lineHeight:1.5}}>
                    Envíe sus datos a un asesor de {cfg.empresa.nombre}. Recibirá una propuesta personalizada adaptada a lo que respondió.
                  </div>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <button onClick={enviarPorWhatsApp}
                    style={{background:'#fff',color:'#128C7E',border:'none',padding:'12px 20px',borderRadius:8,cursor:'pointer',fontSize:13,fontWeight:800,boxShadow:'0 2px 6px rgba(0,0,0,.15)'}}>
                    💬 Enviar por WhatsApp
                  </button>
                  <button onClick={enviarPorEmail}
                    style={{background:'rgba(255,255,255,.2)',color:'#fff',border:'2px solid rgba(255,255,255,.4)',padding:'12px 20px',borderRadius:8,cursor:'pointer',fontSize:13,fontWeight:800}}>
                    📧 Enviar por Email
                  </button>
                </div>
              </div>
            </div>

            {/* Scores per section */}
            <div style={{background:'#fff',borderRadius:12,padding:'14px 20px',marginBottom:18,boxShadow:'0 2px 8px rgba(0,0,0,.05)'}}>
              <div style={{fontSize:12,fontWeight:700,color:C.navy,marginBottom:10}}>📊 Diagnóstico por sección</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:8}}>
                {STEPS.map(s=>{
                  const sc=s.qs.filter(q=>answers[q.id]!==undefined).map(q=>answers[q.id]);
                  const a=sc.length?sc.reduce((x,y)=>x+y,0)/sc.length:0;
                  const col=a>=2.35?C.red:a>=1.75?C.blue:C.green;
                  return(
                    <div key={s.n} style={{background:'#f8fafc',borderRadius:9,padding:'9px 11px'}}>
                      <div style={{fontSize:11,fontWeight:600,color:C.navy,marginBottom:4}}>{s.icon} {s.t}</div>
                      <div style={{height:4,background:'#e2e8f0',borderRadius:2,overflow:'hidden',marginBottom:3}}>
                        <div style={{height:'100%',width:`${(a/3)*100}%`,background:col,borderRadius:2}}/>
                      </div>
                      <div style={{fontSize:10,color:col,fontWeight:700}}>{a.toFixed(1)}/3.0</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Plan cards */}
            <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:12,fontFamily:'Raleway,sans-serif'}}>📋 Las 3 opciones de servicio</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(290px,1fr))',gap:16,marginBottom:20}}>
              {planes.map(p=><PlanCard key={p.id} plan={p} rec={rec} company={company}/>)}
            </div>

            {/* Contact info CTA */}
            <div style={{background:`linear-gradient(135deg,${C.navy},#1a2f45)`,borderRadius:14,padding:'20px 26px',textAlign:'center',marginBottom:16}}>
              <div style={{color:'#fff',fontSize:16,fontWeight:800,fontFamily:'Raleway,sans-serif',marginBottom:6}}>Contacto directo con {cfg.empresa.nombre}</div>
              <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginTop:8}}>
                <div style={{background:'rgba(255,255,255,.1)',borderRadius:8,padding:'8px 14px',color:'#fff',fontSize:12}}>📧 {cfg.empresa.email}</div>
                <div style={{background:'rgba(255,255,255,.1)',borderRadius:8,padding:'8px 14px',color:'#fff',fontSize:12}}>📞 {cfg.empresa.tel}</div>
                <div style={{background:'rgba(255,255,255,.1)',borderRadius:8,padding:'8px 14px',color:'#fff',fontSize:12}}>🌐 {cfg.empresa.web}</div>
              </div>
            </div>

            {/* Secondary actions */}
            <div className="no-print" style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginBottom:30}}>
              <button onClick={()=>window.print()}
                style={{background:'#fff',border:`2px solid ${C.navy}`,color:C.navy,padding:'10px 18px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:700}}>
                🖨 Imprimir / Guardar como PDF
              </button>
              <button onClick={()=>{setPhase('intro');setAnswers({});setSelIdx({});setStep(1);setAutoSent(false);setAutoSentStatus('');setCompany('');setContact('');setPhone('');setEmail('');}}
                style={{background:'#f1f5f9',border:'2px solid #e2e8f0',color:'#374151',padding:'10px 18px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:700}}>
                🔄 Nueva evaluación
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
